[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-watch"
version = "1.0.0"
description = "Frozen-encoder semantic change classification with paired spatial evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Heritage Watch contributors"}]
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.8,<1.9",
    "rasterio>=1.4,<2",
    "torch>=2.8,<3",
    "timm>=1.0.26,<2",
    "satlaspretrain-models>=0.3.1,<0.4",
    "PyYAML>=6,<7",
    "joblib>=1.5,<2",
    "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
heritage-watch = "heritage_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=out/pytest-work"
